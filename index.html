<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>MindOS | Asistente académico</title>
    <meta
      name="description"
      content="MindOS junta tus clases y entregas de todas tus plataformas, detecta cuándo tu semana deja de ser viable y la reorganiza contigo desde WhatsApp."
    />
    <meta name="theme-color" content="#ece9f6" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=swap" />
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/app.css" />
    <script>
      // Antes de pintar: aplica el tema guardado y oculta la app hasta que esté montada,
      // para que no haya destellos ni saltos de contenido. Sin JavaScript no se ejecuta.
      document.documentElement.dataset.loading = '';
      setTimeout(() => {
        // Si la app no logró montarse (por ejemplo, abierta con file://), se explica cómo abrirla.
        if (!('loading' in document.documentElement.dataset)) return;
        delete document.documentElement.dataset.loading;
        document.getElementById('boot-error')?.removeAttribute('hidden');
      }, 3000);
      try {
        // Debe coincidir con STORAGE_KEY en src/app/persistence.js.
        const theme = JSON.parse(localStorage.getItem('mindos:demo'))?.prefs?.theme;
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <script type="module" src="src/main.js"></script>
  </head>
  <body data-view="today">
    <a class="skip-link" href="#main">Saltar al contenido</a>

    <header class="topbar">
      <div class="topbar__inner">
        <a class="brand" href="./" aria-label="MindOS, inicio">
          <img class="brand__logo" src="assets/logo.png" alt="" width="40" height="40" />
          <span class="brand__name">MindOS</span>
        </a>

        <nav class="segmented topnav" aria-label="Secciones">
          <button type="button" class="segmented__item" data-nav="today">Hoy</button>
          <button type="button" class="segmented__item" data-nav="week">Semana</button>
          <button type="button" class="segmented__item" data-nav="tasks">Pendientes</button>
          <button type="button" class="segmented__item" data-nav="sources">Fuentes</button>
          <button type="button" class="segmented__item topnav__assistant" data-nav="assistant">
            Asistente
            <span class="badge" data-unread hidden></span>
          </button>
        </nav>

        <div class="topbar__actions">
          <button type="button" class="btn btn--sm" id="tour-start">
            <span data-icon="play" data-size="18"></span>
            <span class="topbar__tour-label">Demo guiada</span>
          </button>
          <button type="button" class="btn btn--icon btn--sm" id="theme-toggle" aria-label="Cambiar a modo oscuro"></button>
        </div>
      </div>
    </header>

    <div class="layout">
      <main id="main" class="main" tabindex="-1">
        <section id="tour" class="tour" aria-labelledby="tour-title" hidden></section>
        <div id="view">
          <p id="boot-error" class="noscript" hidden>
            No se pudo iniciar la demo. Si abriste el archivo directamente, ejecuta <code>npm start</code> y entra a
            http://localhost:5173.
          </p>
        </div>
        <footer class="footer">
          <p>Demo con datos simulados: no se conecta a cuentas reales. Propuesta de Análisis y Diseño de Sistemas, IPN.</p>
          <button type="button" class="btn btn--ghost btn--sm" id="reset-demo">
            <span data-icon="restart" data-size="18"></span>
            Reiniciar demo
          </button>
        </footer>
      </main>
      <aside id="assistant" class="assistant" aria-label="MindOS en WhatsApp" data-tour="assistant"></aside>
    </div>

    <nav class="tabbar" aria-label="Secciones">
      <button type="button" class="tabbar__item" data-nav="today"><span data-icon="today"></span>Hoy</button>
      <button type="button" class="tabbar__item" data-nav="week"><span data-icon="week"></span>Semana</button>
      <button type="button" class="tabbar__item" data-nav="tasks"><span data-icon="tasks"></span>Pendientes</button>
      <button type="button" class="tabbar__item" data-nav="sources"><span data-icon="sources"></span>Fuentes</button>
      <button type="button" class="tabbar__item" data-nav="assistant">
        <span data-icon="chat"></span>Asistente
        <span class="badge" data-unread hidden></span>
      </button>
    </nav>

    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

    <noscript>
      <p class="noscript">MindOS necesita JavaScript para mostrar la demo interactiva.</p>
    </noscript>
  </body>
</html>
